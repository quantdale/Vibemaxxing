name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    # The primary release lane: a fresh Windows checkout must install, test,
    # doctor, run the real-app E2E, package, launch the packaged build and
    # produce the NSIS installer.
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Electron itself (~100 MB) and electron-builder's NSIS/winCodeSign tools
      # re-download on every run otherwise; keyed on the lockfile + builder so
      # an upgrade busts the cache exactly when it must.
      - name: Cache Electron and electron-builder downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Unit & regression tests
        run: npm test

      - name: Doctor (CI mode)
        run: npm run doctor -- --ci

      - name: PTY smoke under Electron
        run: npm run smoke:pty

      - name: Electron E2E (real app, isolated profile)
        run: npm run test:e2e

      - name: Package (unpacked)
        run: npm run pack

      - name: Packaged-app smoke
        run: npm run smoke:packaged

      - name: Build NSIS installer
        # predist:win seeds the winCodeSign cache first - runners are not
        # elevated, so electron-builder's own extraction dies on the two
        # darwin symlinks in that archive.
        run: npm run dist:win

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: tote-win-installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Upload E2E failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tote-e2e-failures
          path: |
            test-results/
          if-no-files-found: ignore

  linux:
    # Cross-platform health: same install/tests/doctor on Linux.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron download
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/electron
            ~/.cache/electron-builder
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      # node-pty has no linux prebuilds, so npm ci compiles it from source;
      # the runner image already ships build-essential + python.
      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund

      - name: Unit & regression tests
        run: npm test

      - name: Doctor (CI mode)
        run: npm run doctor -- --ci

# macOS lane: deliberately deferred. Tote ships a DMG and carries the
# macOS-only Downloads bridge, but a hosted macos runner for every push is
# disproportionate today; the bridge is also inert unless a native LLM app
# stamps quarantine xattrs. Tracked as known debt in README (Testing section).
